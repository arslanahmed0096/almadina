name: Deploy Laravel to Hostinger Development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build frontend
        env:
          # Keep the development deployment consistent with the production
          # workflow for the large Mix/Webpack production build.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci
          npm run production

      - name: Setup SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_HOST" || -z "$SSH_PORT" || -z "$SSH_PRIVATE_KEY" ]]; then
            echo "::error::Missing HOSTINGER_HOST, HOSTINGER_PORT, or HOSTINGER_SSH_PRIVATE_KEY GitHub secret."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if ! ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY is invalid or passphrase-protected. Store the complete unencrypted private key, including its BEGIN and END lines."
            exit 1
          fi

          : > ~/.ssh/known_hosts
          scan_ok=false
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              scan_ok=true
              break
            fi
            echo "SSH host-key scan attempt $attempt failed; retrying..."
            sleep 2
          done

          if [[ "$scan_ok" != true || ! -s ~/.ssh/known_hosts ]]; then
            echo "::error::Unable to reach SSH at $SSH_HOST:$SSH_PORT. Verify HOSTINGER_HOST and HOSTINGER_PORT and confirm SSH access is enabled in Hostinger."
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Upload files
        run: |
          rsync -avz --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="storage" \
            --exclude="node_modules" \
            --exclude="vendor" \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }}" \
            ./ ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_DEV_PATH }}

      - name: Laravel commands
        run: |
          ssh -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} << 'EOF'
            cd ${{ secrets.HOSTINGER_DEV_PATH }}

            composer_dependencies_hash="$(sha256sum composer.json composer.lock | sha256sum | awk '{print $1}')"
            installed_dependencies_hash="$(cat storage/.composer-dependencies.sha256 2>/dev/null || true)"

            if [ ! -f vendor/autoload.php ] || [ "$composer_dependencies_hash" != "$installed_dependencies_hash" ]; then
              echo "Composer dependencies changed; installing dependencies..."
              composer install --no-dev --optimize-autoloader --no-interaction
              printf '%s\n' "$composer_dependencies_hash" > storage/.composer-dependencies.sha256
            else
              echo "Composer dependencies unchanged; skipping composer install."
            fi

            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

            chmod -R 775 storage bootstrap/cache
          EOF
